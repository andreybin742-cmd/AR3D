<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📦 Шкаф в AR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            padding: 15px;
        }
        h1 {
            font-size: 18px;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
            margin-bottom: 12px;
            letter-spacing: 3px;
        }
        #container {
            width: 100%;
            max-width: 700px;
            height: 50vh;
            max-height: 450px;
            background: #111122;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background: #111122;
        }
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111122;
            z-index: 5;
            transition: opacity 0.8s;
            pointer-events: none;
        }
        #loader.hidden {
            opacity: 0;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.05);
            border-top: 3px solid #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loaderText {
            margin-top: 16px;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            letter-spacing: 1px;
        }
        #fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            text-align: center;
            padding: 30px;
        }
        #fallback .icon { font-size: 48px; margin-bottom: 10px; }
        #fallback .text { font-size: 14px; }

        .controls {
            margin-top: 16px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #4a9eff, #6b6bff);
            color: white;
            box-shadow: 0 4px 20px rgba(74, 158, 255, 0.3);
        }
        .btn:hover { transform: scale(1.04); }
        .btn:active { transform: scale(0.96); }
        .btn-ar {
            background: linear-gradient(135deg, #00cc88, #00aa66);
            box-shadow: 0 4px 20px rgba(0, 204, 136, 0.3);
        }
        .btn-ar:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        .hint {
            margin-top: 14px;
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            letter-spacing: 1px;
            text-align: center;
        }
        #status {
            margin-top: 8px;
            font-size: 13px;
            min-height: 24px;
            text-align: center;
            padding: 0 10px;
        }
        #status.error { color: rgba(255,100,100,0.7); }
        #status.success { color: rgba(0,255,200,0.7); }
        #status.info { color: rgba(255,255,255,0.3); }

        @media (max-width: 600px) {
            #container { height: 45vh; max-height: 350px; }
            h1 { font-size: 15px; }
            .btn { padding: 10px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <h1>📦 ШКАФ В ДОПОЛНЕННОЙ РЕАЛЬНОСТИ</h1>

    <div id="container">
        <!-- Индикатор загрузки -->
        <div id="loader">
            <div class="spinner"></div>
            <div id="loaderText">⏳ Загрузка модели...</div>
        </div>

        <!-- Запасной вариант (если модель не загрузится) -->
        <div id="fallback">
            <div class="icon">📦</div>
            <div class="text">Модель не загрузилась<br>Проверь интернет-соединение</div>
        </div>

        <!-- Основной 3D-вьювер -->
        <model-viewer
            id="modelViewer"
            src="https://aiprintgen.com/3d-models/ar-viewer-wall-mounted-cabinet-glb-3d-model"
            camera-controls
            auto-rotate
            rotation-per-second="12deg"
            shadow-intensity="0.6"
            ar
            ar-modes="scene-viewer webxr quick-look"
            ar-scale="auto"
            alt="3D модель шкафа"
            style="width:100%; height:100%;"
        ></model-viewer>
    </div>

    <div class="controls">
        <button class="btn btn-ar" id="arBtn">🔮 Посмотреть в AR</button>
        <button class="btn" id="resetBtn">⟳ Сбросить вид</button>
    </div>

    <div id="status">⏳ Проверка поддержки AR...</div>

    <div class="hint">
        <span>🖱 Вращай мышкой</span>
        <span>🔍 Скролл для зума</span>
        <span>📱 На телефоне — пальцем</span>
    </div>

    <script type="module">
        import 'https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js';

        const modelViewer = document.getElementById('modelViewer');
        const container = document.getElementById('container');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const fallback = document.getElementById('fallback');
        const arBtn = document.getElementById('arBtn');
        const resetBtn = document.getElementById('resetBtn');
        const status = document.getElementById('status');

        let loadAttempts = 0;
        const maxAttempts = 3;

        // ---- ФУНКЦИЯ ДЛЯ СТАТУСА ----
        function setStatus(text, type = 'info') {
            status.textContent = text;
            status.className = type;
        }

        // ---- ЗАГРУЗКА МОДЕЛИ С ПОВТОРОМ ----
        function loadModel() {
            loadAttempts++;
            loaderText.textContent = `⏳ Загрузка модели (попытка ${loadAttempts}/${maxAttempts})...`;
            
            // Принудительно перезагружаем модель
            const src = modelViewer.src;
            modelViewer.src = '';
            setTimeout(() => {
                modelViewer.src = src;
            }, 100);
        }

        // ---- ОБРАБОТЧИК СОБЫТИЙ ЗАГРУЗКИ ----
        modelViewer.addEventListener('load', () => {
            loader.classList.add('hidden');
            fallback.style.display = 'none';
            setStatus('✅ Модель загружена!', 'success');
            console.log('✅ Модель загружена успешно');
        });

        modelViewer.addEventListener('error', (e) => {
            console.warn('⚠️ Ошибка загрузки модели:', e);
            
            if (loadAttempts < maxAttempts) {
                // Пробуем перезагрузить
                setTimeout(loadModel, 1000);
            } else {
                // Показываем запасной вариант
                loader.classList.add('hidden');
                fallback.style.display = 'flex';
                setStatus('❌ Не удалось загрузить модель. Проверь интернет.', 'error');
            }
        });

        // Таймаут загрузки (если модель зависла)
        const timeoutId = setTimeout(() => {
            if (!loader.classList.contains('hidden')) {
                if (loadAttempts < maxAttempts) {
                    loadModel();
                } else {
                    loader.classList.add('hidden');
                    fallback.style.display = 'flex';
                    setStatus('❌ Таймаут загрузки. Проверь интернет.', 'error');
                }
            }
        }, 15000);

        // ---- ПРОВЕРКА ПОДДЕРЖКИ AR ----
        function checkARSupport() {
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                        setStatus('✅ AR поддерживается! Нажми "Посмотреть в AR"', 'success');
                        arBtn.disabled = false;
                    } else {
                        checkSceneViewer();
                    }
                }).catch(() => {
                    checkSceneViewer();
                });
            } else {
                checkSceneViewer();
            }
        }

        function checkSceneViewer() {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            const isChrome = /Chrome/i.test(navigator.userAgent) && /Android/i.test(navigator.userAgent);

            if (isMobile && (isChrome || isSafari)) {
                setStatus('📱 Открой в Chrome (Android) или Safari (iOS) для AR', 'info');
                arBtn.disabled = false;
            } else if (isMobile) {
                setStatus('⚠️ Используй Chrome на Android или Safari на iOS', 'error');
                arBtn.disabled = true;
            } else {
                setStatus('💻 AR работает только на телефоне. Но 3D-модель доступна!', 'info');
                arBtn.disabled = true;
            }
        }

        // ---- КНОПКА AR ----
        arBtn.addEventListener('click', async () => {
            setStatus('🔮 Запускаем AR...', 'info');
            
            try {
                if (modelViewer.canActivateAR) {
                    modelViewer.activateAR();
                    setStatus('✅ AR запущен! Наведи на пол', 'success');
                } else {
                    const arUrl = modelViewer.getARUrl?.();
                    if (arUrl) {
                        setStatus('📱 Открываю в AR...', 'info');
                        window.open(arUrl, '_blank');
                    } else {
                        throw new Error('AR не доступен');
                    }
                }
            } catch (err) {
                setStatus('❌ Не удалось запустить AR. Попробуй в Chrome на Android или Safari на iOS.', 'error');
                console.warn('AR error:', err);
            }
        });

        // ---- КНОПКА СБРОСА ----
        resetBtn.addEventListener('click', () => {
            modelViewer.cameraTarget = '0 0 0';
            modelViewer.cameraOrbit = '0 0 3';
            modelViewer.autoRotate = true;
            setStatus('✅ Вид сброшен', 'info');
        });

        // ---- СОБЫТИЯ AR ----
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                setStatus('✅ AR активен! Осмотри шкаф в комнате', 'success');
            }
            if (event.detail.status === 'session-ended') {
                setStatus('🔙 Выход из AR', 'info');
            }
        });

        // ---- ЗАПУСК ----
        setTimeout(() => {
            checkARSupport();
            // Начинаем загрузку
            loadModel();
        }, 300);

        console.log('📦 Шкаф в AR запущен!');
        console.log('📱 Открой на телефоне для AR-режима');
    </script>
</body>
</html>
